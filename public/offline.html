<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TaskFlow – Offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#fafafc; color:#18181e; text-align:center; }
    @media (prefers-color-scheme: dark) { body { background:#0f0f13; color:#ededf2; } }
    .card { max-width:320px; }
    img { width:64px; height:64px; border-radius:16px; }
    h1 { font-size:20px; margin:16px 0 8px; }
    p { margin:0 0 20px; color:#71717e; font-size:15px; line-height:1.5; }
    button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:12px 20px; min-height:44px; background:#6366f1; color:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>TaskFlow needs a connection to load and save your tasks. Nothing was changed. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
